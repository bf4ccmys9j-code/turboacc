name: Build TurboACC for Cudy TR3000 v1
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt 25.12
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-25.12
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk libncurses-dev libssl-dev python3-distutils python3-pip rsync unzip zlib1g-dev file wget git

      - name: Feeds 更新
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 下载 TurboACC / FullconeNAT / Shortcut-FE 源码（带重试，禁止git弹窗）
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          rm -rf package/network/services/fullconenat
          rm -rf package/network/services/fullconenat-nft
          rm -rf package/qca/shortcut-fe
          rm -rf package/luci-app-turboacc

          # 重试函数
          git_clone_retry() {
            local repo="$1"
            local target="$2"
            for i in {1..3}; do
              echo "尝试第 $i 次 clone $repo -> $target"
              if git clone --depth 1 "$repo" "$target"; then
                return 0
              fi
              sleep 5
            done
            echo "克隆失败：$repo"
            exit 1
          }

          git_clone_retry "https://github.com/fullcone-nat-nftables/fullconenat-nft.git" "package/network/services/fullconenat-nft"
          git_clone_retry "https://github.com/rufengsuixing/luci-app-turboacc.git" "package/luci-app-turboacc"
          git_clone_retry "https://github.com/immortalwrt/packages.git" "tmp_pkgs"
          cp -r tmp_pkgs/net/shortcut-fe package/qca/shortcut-fe
          rm -rf tmp_pkgs

      - name: 配置 .config（Cudy TR3000 v1 MT7981）
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000_v1=y
          CONFIG_PACKAGE_kmod-shortcut-fe=m
          CONFIG_PACKAGE_shortcut-fe=m
          CONFIG_PACKAGE_fullconenat-nft=m
          CONFIG_PACKAGE_luci-app-turboacc=m
          EOF
          make defconfig

      - name: 编译模块
        run: |
          make package/network/services/fullconenat-nft/compile -j$(nproc)
          make package/qca/shortcut-fe/compile -j$(nproc)
          make package/luci-app-turboacc/compile -j$(nproc)

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: turboacc-build-output
          path: |
            bin/packages/aarch64_cortex-a53/**/*.ipk
